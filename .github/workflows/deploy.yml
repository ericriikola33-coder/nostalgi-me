name: Publicera till Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ladda upp mappen site till projektet "nostalgi"
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 9989c3610ace11a20637b4cdbb645862
          command: pages deploy site --project-name=nostalgi --branch=main --commit-dirty=true
